services:
  - type: web
    name: stockwise
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Diisi manual di dashboard Render (Environment) dengan connection string Neon
      - key: DATABASE_URL
        sync: false
