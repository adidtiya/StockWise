name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seed:
        description: "Jalankan seed data demo ke Supabase"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.SUPABASE_SESSION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_SESSION_DATABASE_URL }}
      DATABASE_SSL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml

      - name: Validate required secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Secret SUPABASE_SESSION_DATABASE_URL belum diisi."
            exit 1
          fi

      - name: Install backend dependencies
        run: pip install -e ./src/backend

      - name: Run Alembic migrations
        working-directory: src/backend
        run: alembic upgrade head

      - name: Seed demo data
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed == 'true' }}
        working-directory: src/backend
        run: python -m app.seed

      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL belum diisi."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
